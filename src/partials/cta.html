<section class="cta section" id="contact">
  <div class="cta__bg"><img src="{{ROOT}}assets/img/{{CTA_IMG}}-lg.webp" alt="" loading="lazy"></div>
  <div class="container">
    <div class="reveal">
      <div class="eyebrow" style="color:var(--brass)">Консультація інженера</div>
      <h2 class="h2">{{CTA_TITLE}}</h2>
      <p class="lead" style="margin-top:18px;color:rgba(255,255,255,.8)">{{CTA_TEXT}}</p>
      <a class="cta__phone" href="tel:+380673940000"><small>Телефонуйте</small>+38 067 39 40 000</a>
      <a class="cta__phone" href="tel:+380672400166" style="margin-top:8px">+38 067 24 00 166</a>
      <div class="messengers">
        <a href="https://t.me/+380673940000" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6 18.7 19.7c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.5-.6-.2L6.2 13.4 1.4 11.9c-1-.3-1.1-1 .2-1.5l18.9-7.3c.9-.3 1.6.2 1.4 1.5z"/></svg>Telegram</a>
        <a href="viber://add?number=380673940000"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 2 3 5 3 10.5c0 2.6 1 4.7 2.6 6.1V21l3.5-2c1 .2 1.9.3 2.9.3 5 0 9-3.4 9-8.9S17 2 12 2zm4.1 12.4c-.2.5-1.2 1-1.7 1-.4 0-.9.2-3-.7-2.5-1.1-4.1-3.7-4.2-3.9-.1-.2-1-1.4-1-2.6s.6-1.8.9-2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.4.2.5.3 0 .2 0 .6-.2 1.1z"/></svg>Viber</a>
        <a href="https://wa.me/380673940000" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.4-3c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3c.2-.6.2-1.1.2-1.2-.1-.2-.3-.3-.5-.4z"/></svg>WhatsApp</a>
      </div>
    </div>
    <form class="form reveal" id="lead-form" data-delay="1" novalidate>
      <div class="row">
        <div class="field"><label for="f-name">Ваше ім'я</label><input id="f-name" name="name" type="text" placeholder="Як до вас звертатися" autocomplete="name"></div>
        <div class="field"><label for="f-phone">Телефон *</label><input id="f-phone" name="phone" type="tel" placeholder="+38 0__ ___ __ __" autocomplete="tel" required></div>
      </div>
      <div class="field">
        <label>Що вас цікавить?</label>
        <div class="chips">
          <label><input type="checkbox" name="topic" value="Берегоукріплення"{{CHK_hydro}}><span>Берегоукріплення</span></label>
          <label><input type="checkbox" name="topic" value="Причал / понтони"{{CHK_pontoon}}><span>Причал / понтони</span></label>
          <label><input type="checkbox" name="topic" value="Яхт-клуб"{{CHK_marina}}><span>Яхт-клуб</span></label>
          <label><input type="checkbox" name="topic" value="Будинок на воді"{{CHK_float}}><span>Будинок на воді</span></label>
          <label><input type="checkbox" name="topic" value="Пересадка дерев"{{CHK_trees}}><span>Пересадка дерев</span></label>
          <label><input type="checkbox" name="topic" value="Оренда техніки"{{CHK_rental}}><span>Оренда техніки</span></label>
          <label><input type="checkbox" name="topic" value="Чистка водойми"><span>Чистка водойми</span></label>
          <label><input type="checkbox" name="topic" value="Інше"><span>Інше</span></label>
        </div>
      </div>
      <div class="field"><label for="f-msg">Коротко про задачу</label><textarea id="f-msg" name="message" rows="3" placeholder="Локація, довжина берега, тип водойми, побажання…"></textarea></div>
      <div class="form__actions">
        <button class="btn btn--primary" type="submit" data-via="whatsapp">Надіслати у WhatsApp</button>
        <button class="btn btn--ghost" type="submit" data-via="telegram">Надіслати у Telegram</button>
      </div>
      <p class="form__note">Натискаючи кнопку, ви даєте згоду на обробку персональних даних. Заявка відкриється у месенджері з уже заповненим текстом — залишиться лише натиснути «Надіслати».</p>
    </form>
  </div>
</section>
